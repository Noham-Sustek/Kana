<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f0e6" />
    <meta name="description" content="Apprendre les hiragana et katakana, 100 % hors ligne." />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- iPhone : lancée depuis l’écran d’accueil en plein écran, sous la barre d’état (safe-area gérée). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kana" />
    <meta name="format-detection" content="telephone=no" />
    <title>Kana</title>
    <script>
      // Applique le thème et le style avant le premier rendu pour éviter le flash.
      try {
        var s = JSON.parse(localStorage.getItem('kana-settings') || '{}').state || {}
        var t = s.theme || 'system'
        document.documentElement.dataset.ui = s.ui || 'papier'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
