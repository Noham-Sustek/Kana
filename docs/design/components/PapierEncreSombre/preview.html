<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{padding:16px;font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
@font-face{font-family:"Klee One Kana";src:url("../../fonts/KleeOne-SemiBold-kana.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Newsreader";src:url("../../fonts/Newsreader-latin.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url("../../fonts/Figtree-latin.woff2") format("woff2");font-weight:300 900;font-display:swap}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
figure{display:flex;flex-direction:column;gap:10px;align-items:center}
figcaption{font:500 12px/1.2 system-ui,sans-serif;color:#77756f;letter-spacing:.02em}
.phone{width:360px;height:740px;display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:30px;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--frame),0 0 0 7px var(--bezel)}
.phone button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
.grow{flex:1;min-height:0}
.ic{flex:none;display:block}
.jp{font-family:var(--jp)}

.A{--jp:"Klee One Kana","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;--ui:"Figtree",system-ui,sans-serif;--serif:"Newsreader",Georgia,serif;--ok:#0b7a53;--ko:#c8321f}
.A.light{--bg:#f5f0e6;--raised:#fbf8f1;--ink:#1e1b17;--muted:#655d51;--line:#d6ccb9;--ctl:#8f8676;--accent:#2a4b9b;--on-accent:#ffffff;--tint:#e1e7f4;--ok-ink:#0b7a53;--ko-ink:#b42a18;--ko-tint:#f7e2dc;--frame:#cfc5b2;--bezel:#e9e2d4}
.A.dark{--bg:#000000;--raised:#141210;--ink:#ede6d8;--muted:#a49b8c;--line:#35302a;--ctl:#6f675c;--accent:#9db4f0;--on-accent:#0b1530;--tint:#141d36;--ok-ink:#4fd1a1;--ko-ink:#ff8a75;--ko-tint:#2a100b;--frame:#2a2622;--bezel:#0d0c0b}
.A .phone{font-family:var(--ui)}
.A .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.A .who{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:15px}
.A .seal{width:32px;height:32px;border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;display:grid;place-items:center;font:600 17px/1 var(--serif)}
.A .iconbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.A .pad{padding:0 20px}
.A .lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.A .lab b{font-weight:600;letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--accent)}
.A .streak{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.A .big{font:500 64px/.9 var(--serif);letter-spacing:-.02em}
.A .big small{font:500 17px/1 var(--serif);letter-spacing:0;margin-left:6px;color:var(--muted)}
.A .week{display:grid;grid-template-columns:repeat(7,20px);gap:5px;text-align:center;font-size:10px;font-weight:600;color:var(--muted)}
.A .week i{display:block;height:20px;border-radius:3px;border:1.5px solid var(--line)}
.A .week i.on{background:var(--accent);border-color:var(--accent)}
.A .week i.now{border:1.5px dashed var(--accent)}
.A .hint{font-size:13px;color:var(--muted);margin-top:8px}
.A hr{border:0;border-top:1px solid var(--line);margin:16px 20px}
.A .path{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.A .cell{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font:600 30px/1 var(--jp);position:relative;border:1.5px solid var(--line);color:var(--muted);overflow:hidden}
.A .cell.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.A .cell.done::after{content:"";position:absolute;right:5px;top:6px;width:9px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg)}
.A .cell.cur{border:2px solid var(--accent);color:var(--ink);background:linear-gradient(to top,var(--tint) 80%,transparent 80%)}
.A .cell.lock{border-style:dashed}
.A .cell.lock .ic{position:absolute;right:3px;top:3px;color:var(--muted)}
.A .next{font-size:13.5px;margin-top:10px}
.A .next b{font-weight:700}
.A .weak{display:flex;gap:8px;margin-top:8px}
.A .wk{width:48px;border:1px solid var(--line);border-radius:4px;background:var(--raised);padding:5px 0 4px;text-align:center}
.A .wk span{display:block;font:600 24px/1.1 var(--jp)}
.A .wk small{font-size:11px;color:var(--muted)}
.A .dock{padding:10px 16px 12px;background:var(--bg)}
.A .cta{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:60px;padding:0 20px;border-radius:6px;background:var(--accent);color:var(--on-accent)}
.A .cta strong{display:block;font-size:17px;font-weight:700}
.A .cta span{font-size:12.5px;opacity:.92}
.A .sub{display:block;width:100%;min-height:44px;text-align:center;font-weight:600;font-size:14px;color:var(--accent)}
.A .tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:8px}
.A .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11.5px;font-weight:600;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
.A .tab.on{color:var(--accent);border-top-color:var(--accent)}
.A .tab .g{font:600 21px/22px var(--jp)}
/* question */
.A .qtop{display:flex;align-items:center;gap:8px;padding:12px 16px 0 6px}
.A .ticks{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.A .ticks i{height:5px;border-radius:1px;background:var(--line)}
.A .ticks i.d{background:var(--accent)}
.A .ticks i.c{background:var(--ink)}
.A .count{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.A .kind{display:flex;justify-content:center;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:14px}
.A .ask{text-align:center;font:500 24px/1.1 var(--serif);margin-top:4px}
.A .genko{width:212px;height:212px;margin:0 auto 18px;border:1.5px solid var(--ink);border-radius:4px;background:var(--raised);position:relative;display:grid;place-items:center;font:600 148px/1 var(--jp)}
.A .genko::before,.A .genko::after{content:"";position:absolute;border:0 dashed var(--line)}
.A .genko::before{left:50%;top:8px;bottom:8px;border-left-width:1.5px}
.A .genko::after{top:50%;left:8px;right:8px;border-top-width:1.5px}
.A .genko span{position:relative;z-index:1}
.A .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.A .opt{min-height:62px;border:1.5px solid var(--ctl);border-radius:6px;background:var(--raised);font:500 25px/1 var(--serif);text-align:center;position:relative}
.A .opt.bad{border:2px solid var(--ko);color:var(--ko-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.A .badge{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;background:var(--ko);color:#fff;display:grid;place-items:center}
.A .reveal{display:flex;justify-content:center;align-items:center;gap:8px;min-height:48px;margin:6px 0 10px;width:100%;font-weight:600;font-size:14px;color:var(--muted)}
.A .fb{margin:12px 16px 14px;border:1.5px solid var(--ko);border-radius:6px;background:var(--ko-tint);padding:11px 12px;display:flex;gap:11px;align-items:center}
.A .fb .x{width:30px;height:30px;border-radius:50%;background:var(--ko);color:#fff;display:grid;place-items:center;flex:none}
.A .fb strong{display:block;font-size:14.5px;color:var(--ko-ink)}
.A .fb p{font-size:13px}
.A .fb .jp{font-size:17px;font-weight:600}
</style></head>
