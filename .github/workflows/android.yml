# APK Android (Capacitor) à chaque push sur main : tests, build web en mode android, Gradle.
# Signé si les secrets KANA_KEYSTORE_BASE64 et KANA_KEYSTORE_PASSWORD existent ; l'APK est alors
# publié dans la release « android » du dépôt (lien fixe à ouvrir depuis le téléphone).
# Sans secrets : APK de debug, en artefact du workflow seulement.
# Branche ui-reload : APK (signé si possible) en artefact seulement, la release reste celle de main.
name: APK Android

on:
  push:
    branches: [main, ui-reload]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Toujours croissant : Android refuse une mise à jour de numéro inférieur.
      KANA_VERSION_CODE: ${{ github.run_number }}0
      HAS_KEY: ${{ secrets.KANA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build:android

      # Espaces et retours à la ligne collés avec les secrets retirés ; la clé est vérifiée
      # avant Gradle pour un message clair si le mot de passe ne lui correspond pas.
      - name: Keystore
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KANA_KEYSTORE_BASE64 }}
          RAW_PASSWORD: ${{ secrets.KANA_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kana-release.jks"
          PASSWORD=$(printf '%s' "$RAW_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$PASSWORD"
          if ! keytool -list -keystore "$RUNNER_TEMP/kana-release.jks" -storepass "$PASSWORD" -alias kana > /dev/null 2>&1; then
            echo "::error::KANA_KEYSTORE_PASSWORD ne correspond pas à la clé KANA_KEYSTORE_BASE64 (voir kana-signing/LISEZMOI.txt)."
            exit 1
          fi
          echo "KANA_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: APK signé
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KANA_KEYSTORE: ${{ runner.temp }}/kana-release.jks
        run: |
          bash ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kana.apk"

      - name: APK de debug
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          bash ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/kana.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kana-apk
          path: ${{ runner.temp }}/kana.apk

      - name: Release « android »
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${KANA_VERSION_CODE}"
          NOTES="Kana ${VERSION} — APK Android signé, construit depuis ${GITHUB_SHA::7}. Installer kana.apk sur le téléphone (autoriser l'installation depuis le navigateur ou Fichiers)."
          if gh release view android > /dev/null 2>&1; then
            gh release edit android --title "Kana ${VERSION} (Android)" --notes "$NOTES" --latest
          else
            gh release create android --title "Kana ${VERSION} (Android)" --notes "$NOTES" --latest
          fi
          gh release upload android "$RUNNER_TEMP/kana.apk" --clobber
